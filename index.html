<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hairconcept 110 — Friseursalon in Kuchen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E0C0A;
    --ink-soft:#57534B;
    --ink-faint:#8B8579;
    --paper:#F6F5F2;
    --line:#DBD6CC;
    --on-dark:#F1EFEA;
    --on-dark-soft:#ABA598;
    --max:1200px;
    --pad: clamp(1.5rem, 5vw, 4.5rem);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{background:var(--paper);color:var(--ink);font-family:'Work Sans', Arial, sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
  img{display:block;max-width:100%;}
  a{color:inherit;}
  ::selection{background:var(--ink);color:var(--paper);}
  a:focus-visible, button:focus-visible{outline:2px solid currentColor;outline-offset:4px;}
  h1,h2,h3{font-family:'Source Serif 4', Georgia, serif;font-weight:500;}
  .eyebrow{text-transform:uppercase;letter-spacing:0.2em;font-size:0.72rem;font-weight:600;}
  .wrap{max-width:var(--max);margin:0 auto;padding-left:var(--pad);padding-right:var(--pad);}
  section{padding:clamp(4.5rem,9vw,7rem) 0;}

  .reveal{opacity:0;transform:translateY(22px);transition:opacity .9s ease, transform .9s ease;}
  .reveal.in-view{opacity:1;transform:translateY(0);}

  /* ---------- Nav ---------- */
  header{position:fixed;top:0;left:0;right:0;z-index:200;background:rgba(14,12,10,0.72);backdrop-filter:blur(10px);}
  .header-inner{position:relative;display:flex;align-items:center;justify-content:space-between;gap:1.2rem;padding:1rem var(--pad);width:100%;}
  nav.main-nav{display:flex;gap:clamp(1.6rem,3vw,3rem);}
  nav.main-nav a{text-decoration:none;font-size:0.85rem;color:var(--on-dark-soft);position:relative;padding-bottom:2px;transition:color .3s ease;white-space:nowrap;}
  nav.main-nav a::after{content:"";position:absolute;left:0;bottom:0;width:0;height:1px;background:var(--on-dark);transition:width .35s ease;}
  nav.main-nav a:hover{color:var(--on-dark);}
  nav.main-nav a:hover::after{width:100%;}
  .nav-logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);height:20px;width:auto;}

  .nav-toggle{display:none;position:relative;width:26px;height:16px;background:none;border:none;cursor:pointer;padding:0;z-index:201;flex-shrink:0;}
  .nav-toggle span{position:absolute;left:0;width:100%;height:1px;background:var(--on-dark-soft);transition:top .3s ease, transform .35s ease, background .3s ease;}
  .nav-toggle span:first-child{top:0;}
  .nav-toggle span:last-child{top:15px;}
  .nav-toggle:hover span{background:var(--on-dark);}
  .nav-toggle.active span:first-child{top:7px;transform:rotate(45deg);}
  .nav-toggle.active span:last-child{top:7px;transform:rotate(-45deg);}

  .nav-cta{flex-shrink:0;}
  .nav-cta .btn{padding:0.6rem 1.15rem;font-size:0.8rem;}

  @media (max-width:1100px){
    nav.main-nav{display:none;}
    .nav-toggle{display:block;}
    .nav-cta{display:none;}
  }

  .btn{display:inline-block;font-size:0.92rem;text-decoration:none;padding:0.85rem 1.7rem;border:1px solid currentColor;cursor:pointer;transition:transform .3s ease, box-shadow .3s ease, background .3s ease, color .3s ease;white-space:nowrap;font-weight:500;}
  .btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,0.16);}
  .btn-fill{background:var(--on-dark);color:var(--ink);border-color:var(--on-dark);}
  .btn-fill:hover{background:transparent;color:var(--on-dark);}
  .btn-ink{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .btn-ink:hover{background:transparent;color:var(--ink);}
  .btn-line{color:var(--on-dark);border-color:var(--on-dark-soft);}
  .btn-line:hover{background:var(--on-dark);color:var(--ink);}

  /* ---------- Mobile Menu Overlay ---------- */
  .mobile-menu{position:fixed;inset:0;background:var(--ink);z-index:150;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.8rem;opacity:0;visibility:hidden;transform:translateY(-12px);transition:opacity .4s ease, transform .4s ease, visibility 0s linear .4s;}
  .mobile-menu.active{opacity:1;visibility:visible;transform:translateY(0);transition:opacity .4s ease, transform .4s ease, visibility 0s linear 0s;}
  .mobile-menu a{font-family:'Source Serif 4',Georgia,serif;font-size:clamp(1.6rem,5.5vw,2.2rem);color:var(--on-dark);text-decoration:none;opacity:0;transform:translateY(14px);transition:opacity .5s ease, transform .5s ease;}
  .mobile-menu.active a{opacity:1;transform:translateY(0);}
  .mobile-menu.active a:nth-child(1){transition-delay:.06s;}
  .mobile-menu.active a:nth-child(2){transition-delay:.12s;}
  .mobile-menu.active a:nth-child(3){transition-delay:.18s;}
  .mobile-menu.active a:nth-child(4){transition-delay:.24s;}
  .mobile-menu.active a:nth-child(5){transition-delay:.3s;}

  .floating-cta{position:fixed;right:1.4rem;bottom:1.4rem;z-index:90;opacity:0;transform:translateY(16px);pointer-events:none;transition:opacity .5s ease, transform .5s ease;}
  .floating-cta.show{opacity:1;transform:translateY(0);pointer-events:auto;}
  .floating-cta .btn{box-shadow:0 12px 30px rgba(0,0,0,0.25);}

  /* ---------- Hero ---------- */
  .hero{position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;background:var(--ink);}
  .hero picture{position:absolute;inset:0;width:100%;height:100%;display:block;}
  .hero img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center;filter:grayscale(55%) brightness(0.75);animation:heroZoom 24s ease-in-out infinite alternate;}
  @keyframes heroZoom{from{transform:scale(1);}to{transform:scale(1.09);}}
  .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(14,12,10,0.35) 0%, rgba(14,12,10,0.55) 55%, rgba(14,12,10,0.92) 100%);}
  .hero-content{position:relative;z-index:2;color:var(--on-dark);padding:0 1.5rem;}
  .hero-content img.logo{height:clamp(52px,6vw,80px);width:auto;margin:0 auto;filter:drop-shadow(0 4px 20px rgba(0,0,0,0.5));opacity:0;animation:logoFade .7s ease forwards;}
  @keyframes logoFade{to{opacity:1;}}
  .scroll-cue{position:absolute;bottom:2.2rem;left:50%;transform:translateX(-50%);z-index:2;display:flex;flex-direction:column;align-items:center;gap:0.5rem;color:var(--on-dark-soft);}
  .scroll-cue span{font-size:0.65rem;text-transform:uppercase;letter-spacing:0.2em;}
  .scroll-cue .line{width:1px;height:34px;background:var(--on-dark-soft);position:relative;overflow:hidden;}
  .scroll-cue .line::after{content:"";position:absolute;top:-100%;left:0;width:100%;height:100%;background:var(--on-dark);animation:scrollLine 2.2s ease-in-out infinite;}
  @keyframes scrollLine{0%{top:-100%;}60%{top:100%;}100%{top:100%;}}

  /* ---------- CTA Banner ---------- */
  .cta-banner{background:var(--ink);color:var(--on-dark);text-align:center;}
  .cta-banner .eyebrow{display:block;color:var(--on-dark-soft);}
  .cta-banner h2{font-size:clamp(2rem,4.6vw,3.2rem);line-height:1.25;margin:0.8rem auto 1.4rem auto;max-width:16ch;}
  .cta-banner p{color:#D6D2C8;max-width:46ch;margin:0 auto 2.2rem auto;line-height:1.75;}
  .cta-btns{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;}

  /* ---------- Philosophy: Bild randabschneidend rechts ---------- */
  #philosophie{padding-top:0;padding-bottom:0;}
  .philosophy{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:stretch;min-height:560px;}
  .philosophy-img{overflow:hidden;}
  .philosophy-img img{width:100%;height:100%;object-fit:cover;filter:grayscale(20%);}
  .philosophy-text{padding:clamp(3rem,6vw,5rem) clamp(2rem,4vw,3.5rem) clamp(3rem,6vw,5rem) var(--pad);display:flex;flex-direction:column;justify-content:center;}
  .philosophy-text h2{font-size:clamp(1.7rem,3vw,2.3rem);margin:0.7rem 0 1.2rem 0;line-height:1.3;}
  .philosophy-text p{color:var(--ink-soft);line-height:1.8;font-size:1.02rem;margin-bottom:1rem;}
  @media (max-width:820px){
    .philosophy{grid-template-columns:1fr;min-height:auto;}
    .philosophy-img img{height:280px;}
    .philosophy-text{padding:2.5rem var(--pad);}
  }

  /* ---------- Section headings ---------- */
  .section-head{text-align:center;margin-bottom:3.5rem;}
  .section-head .eyebrow{display:block;}
  .section-head h2{font-size:clamp(1.9rem,3.6vw,2.6rem);margin-top:0.6rem;}

  /* ---------- Team ---------- */
  .team-wrap{max-width:1600px;margin:0 auto;padding-left:var(--pad);padding-right:var(--pad);}
  .team-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.75rem;}
  @media (max-width:900px){ .team-grid{grid-template-columns:repeat(2,1fr);gap:1.75rem;} }
  @media (max-width:520px){ .team-grid{grid-template-columns:1fr;} }
  .team-card{text-align:center;}
  .team-card .frame{overflow:hidden;margin-bottom:1.3rem;transition:box-shadow .5s ease;}
  .team-card .frame img{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:top;filter:grayscale(15%);transition:transform .8s cubic-bezier(.2,.7,.2,1), filter .6s ease;}
  .team-card:hover .frame{box-shadow:0 24px 50px rgba(14,12,10,0.16);}
  .team-card:hover .frame img{transform:scale(1.08);filter:grayscale(0%);}
  .team-card h3{font-weight:500;font-size:1.25rem;margin-bottom:0.2rem;}
  .team-card .role{display:block;text-transform:uppercase;letter-spacing:0.1em;font-size:0.72rem;color:var(--ink-faint);margin-bottom:0.5rem;}
  .team-card .spec{font-size:0.9rem;color:var(--ink-soft);line-height:1.5;}

  /* ---------- Services ---------- */
  .price-grid{display:grid;grid-template-columns:1fr 1fr;gap:3rem;max-width:960px;margin:0 auto;}
  @media (max-width:760px){ .price-grid{grid-template-columns:1fr;} }
  .price-cat{margin-bottom:2.5rem;}
  .price-cat h3{font-family:'Work Sans',sans-serif;text-transform:uppercase;letter-spacing:0.16em;font-size:0.8rem;font-weight:600;border-bottom:1px solid var(--ink);padding-bottom:0.5rem;margin-bottom:1rem;}
  .price-row{display:flex;justify-content:space-between;gap:1rem;padding:0.65rem 0;border-bottom:1px dotted var(--line);font-size:0.95rem;transition:padding-left .35s ease, color .35s ease;}
  .price-row:hover{padding-left:0.5rem;color:var(--ink-soft);}
  .price-row .price{font-family:'Source Serif 4',Georgia,serif;color:var(--ink-soft);white-space:nowrap;}
  .price-note{text-align:center;color:var(--ink-faint);font-size:0.82rem;margin-top:2rem;}

  /* ---------- Gallery ---------- */
  .gallery-wrap{width:90%;max-width:1900px;margin:0 auto;}
  .gallery-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:1rem;}
  @media (max-width:900px){ .gallery-grid{grid-template-columns:repeat(2,1fr);gap:0.6rem;} }
  .gallery-grid .g-frame{overflow:hidden;aspect-ratio:1/1;}
  .gallery-grid img{width:100%;height:100%;object-fit:cover;filter:grayscale(15%);transition:transform .8s cubic-bezier(.2,.7,.2,1), filter .5s ease;cursor:pointer;}
  .gallery-grid .g-frame:hover img{transform:scale(1.08);filter:grayscale(0%);}

  /* ---------- Lightbox ---------- */
  .lightbox{position:fixed;inset:0;z-index:300;background:rgba(14,12,10,0.92);display:none;align-items:center;justify-content:center;padding:3rem 1.5rem;opacity:0;transition:opacity .3s ease;}
  .lightbox.active{display:flex;opacity:1;}
  .lightbox-inner{position:relative;max-width:90vw;max-height:88vh;}
  .lightbox-inner img{display:block;max-width:90vw;max-height:88vh;width:auto;height:auto;object-fit:contain;box-shadow:0 30px 80px rgba(0,0,0,0.5);cursor:default;}
  .lightbox-close{position:absolute;top:-18px;right:-18px;width:40px;height:40px;border-radius:50%;border:none;background:#fff;color:var(--ink);font-size:1.5rem;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(0,0,0,0.28);transition:transform .3s ease;}
  .lightbox-close:hover{transform:scale(1.1) rotate(90deg);}
  @media (max-width:600px){ .lightbox-close{top:-14px;right:-14px;width:34px;height:34px;font-size:1.25rem;} }

  /* ---------- NEWSHA ---------- */
  .newsha{background:var(--ink);color:var(--on-dark);padding-top:0;padding-bottom:0;}
  .newsha-inner{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);align-items:stretch;min-height:560px;}
  .newsha-img{overflow:hidden;}
  .newsha-img img{width:100%;height:100%;object-fit:cover;filter:grayscale(25%);}
  .newsha-text{padding:clamp(3rem,6vw,5rem) var(--pad) clamp(3rem,6vw,5rem) clamp(2rem,4vw,3.5rem);display:flex;flex-direction:column;justify-content:center;}
  .newsha .eyebrow{display:block;color:var(--on-dark-soft);}
  .newsha h2{font-size:clamp(2rem,4vw,2.6rem);margin:0.7rem 0 1rem 0;}
  .newsha p{color:#D6D2C8;max-width:46ch;margin:0 0 1.6rem 0;line-height:1.75;}
  .newsha .btn{align-self:flex-start;}
  .newsha .btn .arrow{display:inline-block;transition:transform .3s ease;margin-left:0.4rem;}
  .newsha .btn:hover .arrow{transform:translateX(6px);}
  .newsha .disclaimer{margin-top:1.2rem;font-size:0.7rem;color:#7A7466;}
  @media (max-width:820px){
    .newsha-inner{grid-template-columns:1fr;min-height:auto;}
    .newsha-img img{height:320px;}
    .newsha-text{padding:2.5rem var(--pad);}
  }

  /* ---------- Contact ---------- */
  .contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:3rem;}
  @media (max-width:820px){ .contact-grid{grid-template-columns:1fr;} }
  .contact-grid h2{font-size:clamp(1.8rem,3.4vw,2.4rem);margin:0.6rem 0 0.7rem 0;}
  .contact-grid .kicker{color:var(--ink-soft);font-size:1.02rem;line-height:1.7;margin-bottom:2rem;}
  .info-block{margin-bottom:1.5rem;}
  .info-block h4{font-size:0.7rem;text-transform:uppercase;letter-spacing:0.16em;color:var(--ink-faint);margin-bottom:0.4rem;}
  .info-block p{color:var(--ink-soft);line-height:1.7;}
  .info-block p a{text-decoration:none;border-bottom:1px solid var(--line);transition:border-color .3s ease;}
  .info-block p a:hover{border-color:var(--ink);}
  .hours-row{display:flex;justify-content:space-between;max-width:280px;padding:0.35rem 0;font-size:0.92rem;border-bottom:1px dotted var(--line);}
  .hours-row.closed span:last-child{color:var(--ink-faint);}

  footer{background:var(--ink);color:var(--on-dark-soft);padding:2.5rem var(--pad) 2rem var(--pad);}
  .footer-inner{max-width:var(--max);margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;}
  .footer-inner img{height:20px;}
  .footer-links{display:flex;gap:1.5rem;}
  .footer-links a{text-decoration:none;font-size:0.85rem;transition:color .3s ease;}
  .footer-links a:hover{color:var(--on-dark);}
  .footer-bottom{max-width:var(--max);margin:1.6rem auto 0 auto;padding-top:1.2rem;border-top:1px solid #211E1A;font-size:0.75rem;color:#6E6A60;}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important;}
    .reveal{opacity:1 !important;transform:none !important;}
  }
</style></head>
<body>

<header>
  <div class="header-inner">
    <button class="nav-toggle" id="navToggle" aria-label="Menü öffnen" aria-expanded="false">
      <span></span><span></span>
    </button>
    <nav class="main-nav">
      <a href="#termin">Termin</a>
      <a href="#team">Team</a>
      <a href="#leistungen">Leistungen</a>
      <a href="#impressionen">Impressionen</a>
      <a href="#kontakt">Kontakt</a>
    </nav>
    <img class="nav-logo" id="navLogo" src="" alt="">
    <div class="nav-cta">
      <a href="#" id="navCtaBtn" target="_blank" rel="noopener" class="btn btn-fill">Online Termin</a>
    </div>
  </div>
</header>

<div class="mobile-menu" id="mobileMenu">
  <a href="#termin">Termin</a>
  <a href="#team">Team</a>
  <a href="#leistungen">Leistungen</a>
  <a href="#impressionen">Impressionen</a>
  <a href="#kontakt">Kontakt</a>
</div>

<div class="floating-cta" id="floatingCta">
  <a href="#" id="floatingCtaBtn" target="_blank" rel="noopener" class="btn btn-fill">Termin buchen</a>
</div>

<main>

  <div class="hero">
    <picture>
      <source media="(max-width: 700px)" srcset="" id="heroMobSource">
      <img class="bg" id="heroImg" src="" alt="" fetchpriority="high">
    </picture>
    <div class="hero-content">
      <img class="logo" id="heroLogo" src="" alt="">
    </div>
    <div class="scroll-cue"><span>Scroll</span><div class="line"></div></div>
  </div>

  <section id="termin" class="cta-banner">
    <div class="wrap reveal">
      <span class="eyebrow" id="bookingEyebrow"></span>
      <h2 id="bookingTitle"></h2>
      <p id="bookingText"></p>
      <div class="cta-btns">
        <a href="#" id="bookingPrimary" target="_blank" rel="noopener" class="btn btn-fill"></a>
        <a href="#" id="bookingSecondary" class="btn btn-line"></a>
      </div>
    </div>
  </section>

  <section id="philosophie">
    <div class="philosophy reveal">
      <div class="philosophy-text">
        <span class="eyebrow" id="aboutEyebrow"></span>
        <h2 id="aboutTitle"></h2>
        <div id="aboutParagraphs"></div>
      </div>
      <div class="philosophy-img"><img id="aboutImg" src="" alt="" loading="lazy"></div>
    </div>
  </section>

  <section id="team">
    <div class="team-wrap">
      <div class="section-head reveal">
        <span class="eyebrow" id="teamEyebrow"></span>
        <h2 id="teamTitle"></h2>
      </div>
      <div class="team-grid" id="teamGrid"></div>
    </div>
  </section>

  <section id="leistungen">
    <div class="wrap">
      <div class="section-head reveal">
        <span class="eyebrow" id="servicesEyebrow"></span>
        <h2 id="servicesTitle"></h2>
      </div>
      <div class="price-grid reveal" id="priceGrid"></div>
      <p class="price-note reveal" id="servicesNote"></p>
    </div>
  </section>

  <section id="impressionen">
    <div class="gallery-wrap">
      <div class="section-head reveal">
        <span class="eyebrow" id="galleryEyebrow"></span>
        <h2 id="galleryTitle"></h2>
      </div>
      <div class="gallery-grid reveal" id="galleryGrid"></div>
    </div>
  </section>

  <section id="newsha" class="newsha">
    <div class="newsha-inner reveal">
      <div class="newsha-img"><img id="newshaImg" src="" alt="" loading="lazy"></div>
      <div class="newsha-text">
        <span class="eyebrow" id="newshaEyebrow"></span>
        <h2 id="newshaTitle"></h2>
        <p id="newshaText"></p>
        <a href="#" id="newshaBtn" target="_blank" rel="noopener sponsored" class="btn btn-fill"></a>
        <p class="disclaimer" id="newshaDisclaimer"></p>
      </div>
    </div>
  </section>

  <section id="kontakt">
    <div class="wrap contact-grid reveal">
      <div>
        <span class="eyebrow" id="contactEyebrow"></span>
        <h2 id="contactTitle"></h2>
        <p class="kicker" id="contactKicker"></p>
        <div class="info-block">
          <h4>Telefon</h4>
          <p><a href="#" id="contactPhone"></a></p>
        </div>
        <div class="info-block">
          <h4>Instagram</h4>
          <p><a href="#" id="contactInstagram" target="_blank" rel="noopener"></a></p>
        </div>
        <div class="info-block">
          <h4>Adresse</h4>
          <p><a href="#" id="contactAddress" target="_blank" rel="noopener"></a></p>
        </div>
        <a href="#" id="contactDirections" target="_blank" rel="noopener" class="btn btn-ink">Route planen</a>
      </div>
      <div>
        <div class="info-block">
          <h4>Öffnungszeiten</h4>
          <div id="hoursList"></div>
        </div>
      </div>
    </div>
  </section>

</main>

<footer>
  <div class="footer-inner">
    <img id="footerLogo" src="" alt="">
    <div class="footer-links">
      <a href="#" id="footerInstagram" target="_blank" rel="noopener">Instagram</a>
      <a href="#" id="footerPhone">Anrufen</a>
    </div>
  </div>
  <div class="footer-bottom" id="footerCopyright"></div>
</footer>

<div class="lightbox" id="lightbox">
  <div class="lightbox-inner">
    <button class="lightbox-close" id="lightboxClose" aria-label="Schließen">&times;</button>
    <img src="" alt="" id="lightboxImg">
  </div>
</div>
<script>
  function esc(str){
    return String(str == null ? '' : str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function setText(id, val){ var el = document.getElementById(id); if(el) el.textContent = (val == null ? '' : val); }
  function setAttr(id, attr, val){ var el = document.getElementById(id); if(el) el.setAttribute(attr, (val == null ? '' : val)); }
  function setSrc(id, val){ var el = document.getElementById(id); if(el) el.src = (val == null ? '' : val); }

  function render(d){
    // --- Meta / Logo (3 Stellen) ---
    if(d.meta){
      if(d.meta.siteTitle) document.title = d.meta.siteTitle;
      var logo = d.meta.logo || 'HClogo.svg';
      ['navLogo','heroLogo','footerLogo'].forEach(function(id){ setSrc(id, logo); setAttr(id,'alt', d.meta.siteTitle || ''); });
    }

    // --- Hero ---
    if(d.hero){
      setSrc('heroImg', d.hero.image);
      setAttr('heroImg','alt', (d.meta && d.meta.siteTitle) || '');
      if(d.hero.imageMobile) setAttr('heroMobSource','srcset', d.hero.imageMobile);
    }

    // --- Booking / Termin-Banner ---
    if(d.booking){
      setText('bookingEyebrow', d.booking.eyebrow);
      setText('bookingTitle', d.booking.title);
      setText('bookingText', d.booking.text);
      setText('bookingPrimary', d.booking.primaryLabel);
      setAttr('bookingPrimary','href', d.booking.primaryUrl);
      setText('bookingSecondary', d.booking.secondaryLabel);
      setAttr('bookingSecondary','href', 'tel:' + (d.booking.phone||''));
      // Nav + Floating CTA teilen sich die Buchungs-URL
      setAttr('navCtaBtn','href', d.booking.primaryUrl);
      setAttr('floatingCtaBtn','href', d.booking.primaryUrl);
    }

    // --- About / Philosophie ---
    if(d.about){
      setText('aboutEyebrow', d.about.eyebrow);
      setText('aboutTitle', d.about.title);
      var ap = document.getElementById('aboutParagraphs');
      if(ap && Array.isArray(d.about.paragraphs)){
        ap.innerHTML = d.about.paragraphs.map(function(p){ return '<p>' + esc(p) + '</p>'; }).join('');
      }
      setSrc('aboutImg', d.about.image);
      setAttr('aboutImg','alt', d.about.title || '');
    }

    // --- Team ---
    if(d.team){
      setText('teamEyebrow', d.team.eyebrow);
      setText('teamTitle', d.team.title);
      var tg = document.getElementById('teamGrid');
      if(tg && Array.isArray(d.team.members)){
        tg.innerHTML = d.team.members.map(function(m){
          return '<div class="team-card reveal">' +
                   '<div class="frame"><img src="' + esc(m.image) + '" alt="' + esc(m.name) + '" loading="lazy"></div>' +
                   '<h3>' + esc(m.name) + '</h3>' +
                   '<span class="role">' + esc(m.role) + '</span>' +
                   '<p class="spec">' + esc(m.spec) + '</p>' +
                 '</div>';
        }).join('');
      }
    }

    // --- Services / Preise ---
    if(d.services){
      setText('servicesEyebrow', d.services.eyebrow);
      setText('servicesTitle', d.services.title);
      setText('servicesNote', d.services.note);
      var pg = document.getElementById('priceGrid');
      var cats = d.services.categories || [];
      if(pg && Array.isArray(cats)){
        var mid = Math.ceil(cats.length / 2);
        var cols = [cats.slice(0, mid), cats.slice(mid)];
        pg.innerHTML = cols.map(function(col){
          return '<div>' + col.map(function(cat){
            var rows = (cat.items || []).map(function(item){
              return '<div class="price-row"><span class="name">' + esc(item.name) + '</span>' +
                     '<span class="price">' + esc(item.price) + '</span></div>';
            }).join('');
            return '<div class="price-cat"><h3>' + esc(cat.category) + '</h3>' + rows + '</div>';
          }).join('') + '</div>';
        }).join('');
      }
    }

    // --- Gallery ---
    if(d.gallery){
      setText('galleryEyebrow', d.gallery.eyebrow);
      setText('galleryTitle', d.gallery.title);
      var gg = document.getElementById('galleryGrid');
      if(gg && Array.isArray(d.gallery.images)){
        gg.innerHTML = d.gallery.images.map(function(src){
          return '<div class="g-frame"><img src="' + esc(src) + '" alt="Frisur Ergebnis" loading="lazy"></div>';
        }).join('');
      }
    }

    // --- NEWSHA ---
    if(d.newsha){
      setText('newshaEyebrow', d.newsha.eyebrow);
      setText('newshaTitle', d.newsha.title);
      setText('newshaText', d.newsha.text);
      var nb = document.getElementById('newshaBtn');
      if(nb){ nb.innerHTML = esc(d.newsha.buttonLabel) + ' <span class="arrow">&rarr;</span>'; nb.setAttribute('href', d.newsha.buttonUrl || '#'); }
      setText('newshaDisclaimer', d.newsha.disclaimer);
      setSrc('newshaImg', d.newsha.image);
      setAttr('newshaImg','alt', d.newsha.title || '');
    }

    // --- Contact ---
    if(d.contact){
      setText('contactEyebrow', d.contact.eyebrow);
      setText('contactTitle', d.contact.title);
      setText('contactKicker', d.contact.kicker);
      setText('contactPhone', d.contact.phoneDisplay);
      setAttr('contactPhone','href', 'tel:' + (d.contact.phone||''));
      setText('contactInstagram', d.contact.instagramHandle);
      setAttr('contactInstagram','href', d.contact.instagramUrl);
      var ca = document.getElementById('contactAddress');
      if(ca){ ca.innerHTML = esc(d.contact.addressLine1) + '<br>' + esc(d.contact.addressLine2); ca.setAttribute('href', d.contact.mapsUrl || '#'); }
      setAttr('contactDirections','href', d.contact.directionsUrl);
    }

    // --- Hours ---
    if(Array.isArray(d.hours)){
      var hl = document.getElementById('hoursList');
      if(hl){
        hl.innerHTML = d.hours.map(function(h){
          return '<div class="hours-row' + (h.closed ? ' closed' : '') + '">' +
                   '<span>' + esc(h.day) + '</span><span>' + esc(h.time) + '</span>' +
                 '</div>';
        }).join('');
      }
    }

    // --- Footer ---
    if(d.footer){ setText('footerCopyright', d.footer.copyright); }
    if(d.contact){
      setAttr('footerInstagram','href', d.contact.instagramUrl);
      setAttr('footerPhone','href', 'tel:' + (d.contact.phone||''));
    }
  }

  function startReveal(){
    var els = document.querySelectorAll('.reveal');
    var obs = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting){ entry.target.classList.add('in-view'); obs.unobserve(entry.target); }
      });
    }, { threshold: 0.15 });
    els.forEach(function(el){ obs.observe(el); });
  }

  function initLightbox(){
    var lightbox = document.getElementById('lightbox');
    var lightboxImg = document.getElementById('lightboxImg');
    var lightboxClose = document.getElementById('lightboxClose');
    var galleryImgs = document.querySelectorAll('.gallery-grid img');
    function openLightbox(src, alt){ lightboxImg.src = src; lightboxImg.alt = alt || ''; lightbox.classList.add('active'); document.body.style.overflow = 'hidden'; }
    function closeLightbox(){ lightbox.classList.remove('active'); document.body.style.overflow = ''; }
    galleryImgs.forEach(function(img){ img.addEventListener('click', function(){ openLightbox(img.getAttribute('src'), img.getAttribute('alt')); }); });
    lightboxClose.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', function(e){ if(e.target === lightbox){ closeLightbox(); } });
    document.addEventListener('keydown', function(e){ if(e.key === 'Escape'){ closeLightbox(); } });
  }

  fetch('content.json', { cache: 'no-cache' })
    .then(function(res){ if(!res.ok) throw new Error('content.json HTTP ' + res.status); return res.json(); })
    .then(function(data){ render(data); })
    .catch(function(err){ console.error('Inhalte konnten nicht geladen werden:', err); })
    .finally(function(){
      // Galerie-Bilder existieren erst nach render() -> Lightbox danach initialisieren
      initLightbox();
      startReveal();
    });

  // --- Floating CTA (unabhängig von content.json) ---
  (function(){
    var hero = document.querySelector('.hero');
    var floatingCta = document.getElementById('floatingCta');
    var obs = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(!entry.isIntersecting){ floatingCta.classList.add('show'); } else { floatingCta.classList.remove('show'); }
      });
    }, { threshold: 0 });
    obs.observe(hero);
  })();

  // --- Mobile menu ---
  (function(){
    var toggle = document.getElementById('navToggle');
    var menu = document.getElementById('mobileMenu');
    function closeMenu(){ toggle.classList.remove('active'); menu.classList.remove('active'); toggle.setAttribute('aria-expanded','false'); document.body.style.overflow=''; }
    function openMenu(){ toggle.classList.add('active'); menu.classList.add('active'); toggle.setAttribute('aria-expanded','true'); document.body.style.overflow='hidden'; }
    toggle.addEventListener('click', function(){ if(menu.classList.contains('active')){ closeMenu(); } else { openMenu(); } });
    menu.querySelectorAll('a').forEach(function(a){ a.addEventListener('click', closeMenu); });
    document.addEventListener('keydown', function(e){ if(e.key === 'Escape'){ closeMenu(); } });
  })();
</script>

</body>
</html>
